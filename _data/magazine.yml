# Tappa Quarterly issues, newest first.
# The first entry is shown as the current issue; the rest appear under "Past issues".
# To add an issue: drop the issue's index.html and its cover.jpg in
# magazine/<slug>/, then add a block at the top of this list.
#
# `url` is where the issue itself lives. Keep the trailing slash.

# Issue 2 is a draft (editors' notes and photo placeholders still on the
# page). Uncomment on release to make it the current issue.
# - title: "Issue 2"
#   date: "Winter 2026"
#   cover: /magazine/issue-2/cover.jpg
#   url: /magazine/issue-2/

- title: "Issue 1"
  date: "Summer 2026"
  cover: /magazine/issue-1/cover.jpg
  url: /magazine/issue-1/
